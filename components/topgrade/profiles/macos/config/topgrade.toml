[misc]
assume_yes = true
ask_retry = false
auto_retry = 1
pre_sudo = false
cleanup = false
display_time = true
notify_end = "never"
disable = ["mamba", "conda", "gcloud", "mas"]

[commands]
"Mac App Store (verified)" = "@studio:mas_verified"
"gcloud (verified)" = "@studio:gcloud_verified"
"SQLite Python trunk" = "@studio:sqlite_python_trunk"
"SQLite trunk" = "@studio:sqlite_trunk"
"TourBox Beta Update" = "@studio:tourbox_beta"
"Xcode Beta Update" = "@studio:xcode_beta_install"

"BetterDisplay Internal Update" = "@studio:betterdisplay_preview"

"Preview macOS Apps" = "@studio:krita_next"
"Conda frozen base" = "conda self update --yes"
"Conda default" = "conda update --all -n default --yes"

"Gradle Nightly Toolchain" = "@studio:gradle_nightly"
"Rolling Project Dependencies" = "@studio:rolling_projects"
"Homebrew Linkage Audit" = "@studio:brew_linkage_audit"
"CLI Tool Versions" = "@studio:cli_versions"
"npm Bundled Dependency Security" = "@studio:npm_bundled_security"
[github_cli]
skills_native = true

[helm]
repository_native = true

[rustup]
channels = ["nightly"]

[brew]
fetch_head = true
autoremove = false
greedy_latest = true

[git]
max_concurrency = 4

[post_commands]
