[workspace]
members = ["crates/studio-core", "crates/studio-platform", "crates/studio-deployment", "crates/studio-app"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["nowaytouse"]
repository = "https://github.com/nowaytouse/ltsc-studio"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
studio-core = { path = "crates/studio-core" }
studio-platform = { path = "crates/studio-platform" }
studio-deployment = { path = "crates/studio-deployment" }

[profile.release]
lto = "thin"
strip = true
