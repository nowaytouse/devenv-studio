name: Package desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux native GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev
      - name: Stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo +stable build --release --locked -p ltsc-studio
      - name: Upload desktop executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ltsc-studio-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/ltsc-studio
            target/release/ltsc-studio.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
            third-party/
