name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux native GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev
      - name: Stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Test
        run: cargo +stable test --workspace --locked --no-fail-fast
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Topgrade component
        if: runner.os == 'macOS'
        working-directory: components/topgrade
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable test --locked
          cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Topgrade profile
        if: runner.os == 'macOS'
        working-directory: components/topgrade
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          brew install python@3.15
          "$(brew --prefix python@3.15)/bin/python3.15" -m unittest discover -s profiles/macos/tests
