[package]
name = "devenv-studio"
default-run = "devenv-studio"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A native Rust workbench for macOS and Windows environment backup, configuration and redeployment"

[[bin]]
name = "devenv-studio"
path = "src/main.rs"

[[bin]]
name = "ltsc-studio"
path = "src/legacy.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
studio-deployment.workspace = true
studio-core.workspace = true
studio-platform.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "system_fonts", "wgpu", "x11", "wayland", "links", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["png"] }
